services:
  # Next.js Frontend & CORS API Proxy Web Service
  - type: web
    name: page-pulse-web
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: true
